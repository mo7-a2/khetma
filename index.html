<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ختمة قرآنية عن روح الحاج محمد سلامه عباس</title>
<meta property="og:title" content="ختمة قرآنية عن روح الحاج محمد سلامه عباس">
<meta property="og:description" content="شارك في الختمة: اختر جزءاً واقرأه، ولا تنسَ الدعاء له بالرحمة والمغفرة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#eceff0; --card:#fff; --ink:#1d2b2e; --mute:#5d6e71; --line:#cfd8da;
  --done:#14504a; --done-ink:#fff; --read:#e3b04b; --read-ink:#3b2a05; --mine:#8a4b08;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Amiri','Scheherazade New',serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7;padding:0 0 40px}
header{background:var(--done);color:#fff;text-align:center;padding:36px 18px 30px}
header p{opacity:.85;font-size:17px}
header h1{font-size:clamp(30px,8vw,52px);line-height:1.35;font-weight:700;margin:6px 0 8px}
.dua{font-size:20px;margin-top:6px}
main{max-width:760px;margin:0 auto;padding:0 14px}
.prog{margin:22px 0 6px;font-size:17px;color:var(--mute);display:flex;justify-content:space-between}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .5s}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0;font-size:16px;color:var(--mute)}
.legend b{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-left:6px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.j{font:inherit;text-align:center;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 6px;cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:center;gap:0}
.j .n{font-weight:700;font-size:19px}
.j .s{font-size:16px;color:var(--mute)}
.j .w{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.j.reading{background:var(--read);border-color:var(--read);color:var(--read-ink)}
.j.reading .s{color:var(--read-ink)}
.j.done{background:var(--done);border-color:var(--done);color:var(--done-ink)}
.j.done .s{color:#cfe7e3}
.j.mine{outline:3px solid var(--mine);outline-offset:2px}
.j:focus-visible,button:focus-visible{outline:3px solid #1b6fd6;outline-offset:2px}
h2{font-size:24px;margin:34px 0 12px}
.ctr{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.ctr{grid-template-columns:repeat(4,1fr)}}
.c{font:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 6px;cursor:pointer;color:var(--ink)}
.c:active{background:#dfe9e7}
.c b{display:block;font-size:30px;line-height:1.2;color:var(--done)}
.c span{font-size:18px}
.note{color:var(--mute);font-size:16px;margin-top:8px}
dialog{border:none;border-radius:14px;padding:22px;width:min(92vw,380px);font:inherit;color:var(--ink)}
dialog::backdrop{background:rgba(10,25,28,.55)}
dialog h3{font-size:22px;margin-bottom:10px}
input{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin:8px 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--done);color:#fff}
.btn.alt{background:#e4e9ea;color:var(--ink)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2b2e;color:#fff;padding:10px 18px;border-radius:10px;font-size:17px;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
footer{text-align:center;color:var(--mute);font-size:16px;margin-top:36px;padding:0 14px}
</style>
</head>
<body>
<header>
  <p>ختمة قرآنية عن روح المرحوم بإذن الله</p>
  <h1>الحاج محمد سلامه عباس</h1>
  <div class="dua">اللهم ارحمه واغفر له وأسكنه فسيح جناتك</div>
</header>
<main>
  <div class="prog"><span id="pt">جاري التحميل…</span><span id="pp"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="legend">
    <span><b style="background:#fff"></b>غير مقروء</span>
    <span><b style="background:var(--read)"></b>جاري القراءة</span>
    <span><b style="background:var(--done)"></b>مقروء</span>
  </div>
  <div class="grid" id="grid"></div>

  <h2>اهدِ له ثواباً</h2>
  <div class="ctr" id="ctr"></div>
  <p class="note">اضغط على الزر كل مرة تقرأ أو تدعو، والعدد يظهر للجميع.</p>
</main>
<footer>تقبّل الله منكم ومنا صالح الأعمال، وجزاكم الله خيراً.</footer>

<dialog id="dlg">
  <h3 id="dt"></h3>
  <div id="dn">
    <label for="nm">اكتب اسمك</label>
    <input id="nm" maxlength="40" autocomplete="name">
  </div>
  <div class="row" id="db"></div>
</dialog>
<div id="toast" role="status"></div>

<script>
/* ====== ضع بيانات مشروعك هنا ====== */
const SUPABASE_URL = "https://fkijzoplkrvnhjzotzup.supabase.co";
const SUPABASE_KEY = "sb_publishable_CS4cT8OXn5zmXSItjIYOgA_lqPVZMQR";
/* ================================== */

const ORD=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر","الثالث عشر","الرابع عشر","الخامس عشر","السادس عشر","السابع عشر","الثامن عشر","التاسع عشر","العشرون","الحادي والعشرون","الثاني والعشرون","الثالث والعشرون","الرابع والعشرون","الخامس والعشرون","السادس والعشرون","السابع والعشرون","الثامن والعشرون","التاسع والعشرون","الثلاثون"];
const SURA=["الفاتحة","البقرة","البقرة","آل عمران","النساء","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","هود","يوسف","الحجر","الإسراء","الكهف","الأنبياء","المؤمنون","الفرقان","النمل","العنكبوت","الأحزاب","يس","الزمر","فصلت","الأحقاف","الذاريات","المجادلة","الملك","النبأ"];
const STATE={unread:"غير مقروء",reading:"جاري القراءة",done:"مقروء"};
const CTRS=[["fatiha","الفاتحة"],["yaseen","يس"],["dua","دعاء"],["tasbeeh","تسبيح"]];

const $=id=>document.getElementById(id);
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let juz=[],counts={},tokens={};
try{tokens=JSON.parse(localStorage.getItem("khetma_tokens")||"{}")}catch(e){}
const saveTokens=()=>{try{localStorage.setItem("khetma_tokens",JSON.stringify(tokens))}catch(e){}};

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2800)}

function render(){
  const g=$("grid");g.textContent="";
  juz.forEach(r=>{
    const b=document.createElement("button");
    b.className="j "+r.status+(tokens[r.juz_number]&&r.status==="reading"?" mine":"");
    const n=document.createElement("span");n.className="n";n.textContent="الجزء "+ORD[r.juz_number-1];
    const su=document.createElement("span");su.className="s";su.textContent="من سورة "+SURA[r.juz_number-1];
    const st=document.createElement("span");st.className="s";st.textContent=STATE[r.status];
    b.append(n,su,st);
    if(r.reader_name){const w=document.createElement("span");w.className="w";w.textContent=r.reader_name;b.append(w)}
    b.onclick=()=>open(r);
    g.append(b);
  });
  const d=juz.filter(r=>r.status==="done").length;
  $("pt").textContent="تم إنجاز "+d+" من 30 جزءاً";
  $("pp").textContent=Math.round(d/30*100)+"%";
  $("pb").style.width=(d/30*100)+"%";
  const c=$("ctr");
  if(!c.children.length){
    CTRS.forEach(([k,l])=>{
      const b=document.createElement("button");b.className="c";b.dataset.k=k;
      b.innerHTML="<b>0</b><span></span>";b.lastChild.textContent=l;
      b.onclick=()=>bump(k);c.append(b);
    });
  }
  [...c.children].forEach(b=>b.firstChild.textContent=(counts[b.dataset.k]||0).toLocaleString("ar-EG"));
}

async function load(){
  const a=await db.from("juz").select("*").order("juz_number");
  if(a.data){juz=a.data}
  else{$("pt").textContent="تعذّر الاتصال، تأكد من إعدادات الصفحة";return}
  const b=await db.from("counters").select("*");
  if(b.data)b.data.forEach(r=>counts[r.type]=Number(r.count));
  render();
}

/* ---- نافذة الجزء ---- */
const dlg=$("dlg");
function btn(t,cls,fn){const b=document.createElement("button");b.className="btn "+(cls||"");b.textContent=t;b.onclick=fn;$("db").append(b)}
function open(r){
  $("db").textContent="";
  const title="الجزء "+ORD[r.juz_number-1];
  const mine=tokens[r.juz_number]&&r.status==="reading";
  if(r.status==="unread"){
    $("dt").textContent=title+" – من سورة "+SURA[r.juz_number-1];
    $("dn").style.display="";
    try{$("nm").value=localStorage.getItem("khetma_name")||""}catch(e){}
    btn("سأقرأ هذا الجزء","",()=>claim(r.juz_number));
    btn("إغلاق","alt",()=>dlg.close());
  }else if(mine){
    $("dt").textContent=title+" – أنت تقرؤه الآن";
    $("dn").style.display="none";
    btn("أتممت القراءة","",()=>finish(r.juz_number,"complete_juz","جزاك الله خيراً، تقبّل الله منك"));
    btn("إلغاء الحجز","alt",()=>finish(r.juz_number,"release_juz","تم إلغاء الحجز"));
  }else{
    toast(r.status==="done"?"تمت قراءة هذا الجزء":"هذا الجزء يقرؤه "+(r.reader_name||"أحد المشاركين"));
    return;
  }
  dlg.showModal();
}
async function claim(n){
  const name=$("nm").value.trim();
  if(name.length<2){toast("اكتب اسمك (حرفان على الأقل)");return}
  try{localStorage.setItem("khetma_name",name)}catch(e){}
  const {data,error}=await db.rpc("claim_juz",{p_juz:n,p_name:name});
  dlg.close();
  if(error){toast("حدث خطأ، حاول مرة أخرى");return}
  if(!data){toast("سبقك أحد المشاركين إلى هذا الجزء، اختر جزءاً آخر");load();return}
  tokens[n]=data;saveTokens();toast("تم حجز الجزء، بارك الله فيك");load();
}
async function finish(n,fn,msg){
  const {data,error}=await db.rpc(fn,{p_juz:n,p_token:tokens[n]});
  dlg.close();
  if(error){toast("حدث خطأ، حاول مرة أخرى");return}
  if(!data){toast("انتهى حجزك لهذا الجزء، يمكنك حجزه من جديد");}
  else toast(msg);
  delete tokens[n];saveTokens();load();
}

/* ---- العدادات (تجميع الضغطات وإرسالها دفعة واحدة) ---- */
const pend={},timers={};
function bump(k){
  pend[k]=(pend[k]||0)+1;counts[k]=(counts[k]||0)+1;render();
  clearTimeout(timers[k]);
  timers[k]=setTimeout(async()=>{
    let left=pend[k];pend[k]=0;
    while(left>0){
      const a=Math.min(left,100);left-=a;
      const {error}=await db.rpc("increment_counter",{p_type:k,p_amount:a});
      if(error){toast("تعذّر حفظ العدّاد");break}
    }
    load();
  },900);
}

load();
db.channel("khetma").on("postgres_changes",{event:"*",schema:"public",table:"juz"},load)
  .on("postgres_changes",{event:"*",schema:"public",table:"counters"},()=>{if(!Object.values(pend).some(v=>v))load()})
  .subscribe();
setInterval(()=>{if(!dlg.open)load()},20000);
</script>
</body>
</html>
